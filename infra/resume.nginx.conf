# Include inside the HTTPS server block for xedoc.ru.
# The public resume is independent of the private controller application.
location = /resume {
    alias /var/www/xedoc.ru/apps/web/dist/resume/index.html;
    default_type text/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-FvSz60CoXPAECyZhOPIbN9r97iGeZAtkDxJJnsg/0Bs='; style-src 'self'; img-src 'self' data:; font-src 'self'; frame-ancestors 'self'; base-uri 'none'; object-src 'none'" always;
}

location ^~ /resume/ {
    alias /var/www/xedoc.ru/apps/web/dist/resume/;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-FvSz60CoXPAECyZhOPIbN9r97iGeZAtkDxJJnsg/0Bs='; style-src 'self'; img-src 'self' data:; font-src 'self'; frame-ancestors 'self'; base-uri 'none'; object-src 'none'" always;
}
